name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'duwaz-student-hub-market-main/Backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'duwaz-student-hub-market-main/Backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duwaz-student-hub-market-main/Backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Runs only the pure unit tests (repository/service dependencies mocked).
      # ApplicationTests is excluded on purpose: it boots the full Spring context,
      # which needs a live Supabase connection this workflow doesn't have — see the
      # commented-out job below for how to add that once you're ready to give CI its
      # own DB credentials (never reuse the production ones for that).
      - name: Run unit tests
        run: ./mvnw test -B -Dtest='!ApplicationTests'

  # Uncomment this once you have credentials for a database CI is allowed to use
  # (a Supabase branch/staging project, ideally — not production) added as repo
  # secrets under Settings → Secrets and variables → Actions:
  #   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
